name: objekts
description: Capture deterministic Flutter widget-test screenshots, including device-framed and failure artifacts.
version: 0.1.0
publish_to: none
repository: https://github.com/putrautama007/flutter_objekts
issue_tracker: https://github.com/putrautama007/flutter_objekts/issues

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  device_frame: ^1.4.0
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: ^3.0.8
  path: ^1.9.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
